name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm

      - run: npm ci

      - run: npm run web-build

      - name: Package WebODM plugin
        run: |
          mkdir -p plugin-staging
          cp -R plugin plugin-staging/gcp-editor-pro
          cp -R dist/gcp-editor-pro plugin-staging/gcp-editor-pro/public
          (cd plugin-staging && zip -qr ../GCPEditorPro-WebODM-Plugin.zip gcp-editor-pro)
          mv GCPEditorPro-WebODM-Plugin.zip dist/gcp-editor-pro/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/gcp-editor-pro

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
