<div class="row">
    <div class="col-xl-3 col-lg-4 col-6" style="min-height: 400px;">
        <div class="card">
            <div class="card-header">
                <strong>Ground Control Points</strong>
            </div>
            <ul class="list-group list-group-flush">
                <li class="list-group-item" *ngFor="let gcpMark of gcps" (click)="select(gcpMark)" (dblclick)="editImages(gcpMark.gcp)"
                    [ngClass]="{ 'bg-dark': this.selectedGCP != null && this.selectedGCP.gcp.name === gcpMark.gcp.name, 'text-white': this.selectedGCP != null && this.selectedGCP.gcp.name === gcpMark.gcp.name }">
                    {{gcpMark.gcp.name}}<span title="3 or more images = good" class="badge ml-2"
                        [ngClass]="{ 'badge-warning': gcpMark.images.length > 0 && gcpMark.images.length < 3, 'badge-success': gcpMark.images.length >= 3, 'badge-light': gcpMark.images.length == 0 }">{{gcpMark.images.length}}
                        {{gcpMark.images.length === 1 ? 'image' : 'images'}}</span><button class="btn btn-sm btn-light mr-2 float-right" (click)="editImages(gcpMark.gcp)">
                            <fa-icon icon="images" class="mr-2"></fa-icon>Tag
                        </button>
                </li>
            </ul>
        </div>
        <div class="mt-2" *ngIf="gcps.length === 0"><fa-icon icon="info-circle" class="mr-2"></fa-icon>Click the marker button from the top left side of the map to add a GCP.</div>
    </div>
    <div class="col-xl-9 col-lg-8 col-6" style="min-height: 400px;">
        <div class="h-100" leaflet (leafletMapReady)="onMapReady($event)" [leafletOptions]="options">
        </div>
    </div>
</div>

<div class="fixed-bottom bg-white d-flex justify-content-between align-items-center">
    <button class="btn btn-primary ml-3 my-3" (click)="back()">
        <fa-icon icon="long-arrow-alt-left" class="mr-2"></fa-icon>Back
    </button>
    <button class="btn btn-primary mr-3 my-3" [disabled]="!isReady" (click)="next()">Go to next step<fa-icon
            icon="long-arrow-alt-right" class="ml-2"></fa-icon></button>

</div>

<ng-template #coordsModal let-modal>
    <form (ngSubmit)="addGcpByCoords(modal)">
        <div class="modal-header">
            <h5 class="modal-title" id="coords-modal-title">Add GCP by Coordinates</h5>
            <button type="button" class="close" aria-label="Close" (click)="modal.dismiss()">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body">
            <p class="text-muted mb-3">Coordinate reference system: <strong>{{projectionName()}}</strong></p>
            <div class="form-group">
                <label for="newGcpName">Name</label>
                <input type="text" class="form-control" id="newGcpName" name="name" [(ngModel)]="newGcp.name" (input)="newGcpError = null">
            </div>
            <div class="form-row">
                <div class="form-group col">
                    <label for="newGcpX">X ({{isGeographic() ? 'Longitude' : 'Easting'}})</label>
                    <input type="text" inputmode="decimal" class="form-control" id="newGcpX" name="x" [(ngModel)]="newGcp.x" (input)="newGcpError = null" ngbAutofocus>
                </div>
                <div class="form-group col">
                    <label for="newGcpY">Y ({{isGeographic() ? 'Latitude' : 'Northing'}})</label>
                    <input type="text" inputmode="decimal" class="form-control" id="newGcpY" name="y" [(ngModel)]="newGcp.y" (input)="newGcpError = null">
                </div>
                <div class="form-group col">
                    <label for="newGcpZ">Z (Elevation)</label>
                    <input type="text" inputmode="decimal" class="form-control" id="newGcpZ" name="z" [(ngModel)]="newGcp.z" (input)="newGcpError = null" placeholder="Optional">
                </div>
            </div>
            <div class="alert alert-danger mb-0" *ngIf="newGcpError">
                <fa-icon icon="exclamation-triangle" class="mr-2"></fa-icon>{{newGcpError}}
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline-dark" (click)="modal.dismiss()">Cancel</button>
            <button type="submit" class="btn btn-primary"><fa-icon icon="plus" class="mr-2"></fa-icon>Add GCP</button>
        </div>
    </form>
</ng-template>
